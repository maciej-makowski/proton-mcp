name: docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

# Security note: the only ${{ }} interpolation in run: blocks is
# steps.build.outputs.digest (build-controlled, not attacker input).
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests
        # pytest lives in [project.optional-dependencies].dev; `uv run` syncs
        # dependency-groups by default but NOT extras, so pass --extra dev.
        run: uv run --extra dev pytest

  build:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/maciej-makowski/proton-mcp:latest
            ${{ env.REGISTRY }}/maciej-makowski/proton-mcp:sha-${{ github.sha }}
          outputs: type=image,compression=zstd

      - name: Image digest
        if: steps.build.outputs.digest
        run: echo "digest=${{ steps.build.outputs.digest }}"
